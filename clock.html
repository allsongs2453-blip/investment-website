<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock - Multiple Time Zones</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: white;
            font-size: 2.5rem;
            margin-bottom: 50px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            font-weight: 700;
        }

        .clocks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;
            animation: slideIn 0.6s ease-in-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .clock-card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            text-align: center;
            transition: all 0.3s ease;
            border: 3px solid transparent;
        }

        .clock-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            border-color: #667eea;
        }

        .timezone-name {
            font-size: 0.95rem;
            color: #666;
            font-weight: 600;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .clock-display {
            font-size: 3rem;
            font-weight: bold;
            color: #667eea;
            font-family: 'Courier New', monospace;
            margin-bottom: 15px;
            letter-spacing: 2px;
            animation: pulse 1s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.8;
            }
        }

        .clock-date {
            font-size: 0.85rem;
            color: #999;
            font-weight: 500;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
                margin-bottom: 30px;
            }

            .clocks-grid {
                grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
                gap: 20px;
            }

            .clock-card {
                padding: 20px;
            }

            .clock-display {
                font-size: 2.2rem;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 1.5rem;
                margin-bottom: 20px;
            }

            .clocks-grid {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .clock-card {
                padding: 15px;
            }

            .clock-display {
                font-size: 1.8rem;
            }

            .timezone-name {
                font-size: 0.8rem;
            }
        }

        /* Dark mode support */
        @media (prefers-color-scheme: dark) {
            body {
                background: linear-gradient(135deg, #2d3561 0%, #1a1a2e 100%);
            }

            .clock-card {
                background: #1e1e2f;
                color: #e0e0e0;
            }

            .timezone-name {
                color: #b0b0b0;
            }

            .clock-display {
                color: #00d4ff;
            }

            .clock-date {
                color: #808080;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Global Time Zones Clock</h1>
        
        <div class="clocks-grid">
            <!-- New York -->
            <div class="clock-card">
                <div class="timezone-name">New York (EST)</div>
                <div class="clock-display" id="clock-ny">00:00:00</div>
                <div class="clock-date" id="date-ny">--</div>
            </div>

            <!-- London -->
            <div class="clock-card">
                <div class="timezone-name">London (GMT)</div>
                <div class="clock-display" id="clock-london">00:00:00</div>
                <div class="clock-date" id="date-london">--</div>
            </div>

            <!-- Tokyo -->
            <div class="clock-card">
                <div class="timezone-name">Tokyo (JST)</div>
                <div class="clock-display" id="clock-tokyo">00:00:00</div>
                <div class="clock-date" id="date-tokyo">--</div>
            </div>

            <!-- Sydney -->
            <div class="clock-card">
                <div class="timezone-name">Sydney (AEDT)</div>
                <div class="clock-display" id="clock-sydney">00:00:00</div>
                <div class="clock-date" id="date-sydney">--</div>
            </div>

            <!-- Dubai -->
            <div class="clock-card">
                <div class="timezone-name">Dubai (GST)</div>
                <div class="clock-display" id="clock-dubai">00:00:00</div>
                <div class="clock-date" id="date-dubai">--</div>
            </div>

            <!-- Singapore -->
            <div class="clock-card">
                <div class="timezone-name">Singapore (SGT)</div>
                <div class="clock-display" id="clock-singapore">00:00:00</div>
                <div class="clock-date" id="date-singapore">--</div>
            </div>

            <!-- Hong Kong -->
            <div class="clock-card">
                <div class="timezone-name">Hong Kong (HKT)</div>
                <div class="clock-display" id="clock-hongkong">00:00:00</div>
                <div class="clock-date" id="date-hongkong">--</div>
            </div>

            <!-- India -->
            <div class="clock-card">
                <div class="timezone-name">India (IST)</div>
                <div class="clock-display" id="clock-india">00:00:00</div>
                <div class="clock-date" id="date-india">--</div>
            </div>
        </div>
    </div>

    <script>
        // Time Zone Configuration
        const timeZones = {
            'ny': { name: 'America/New_York', element: 'clock-ny', dateElement: 'date-ny' },
            'london': { name: 'Europe/London', element: 'clock-london', dateElement: 'date-london' },
            'tokyo': { name: 'Asia/Tokyo', element: 'clock-tokyo', dateElement: 'date-tokyo' },
            'sydney': { name: 'Australia/Sydney', element: 'clock-sydney', dateElement: 'date-sydney' },
            'dubai': { name: 'Asia/Dubai', element: 'clock-dubai', dateElement: 'date-dubai' },
            'singapore': { name: 'Asia/Singapore', element: 'clock-singapore', dateElement: 'date-singapore' },
            'hongkong': { name: 'Asia/Hong_Kong', element: 'clock-hongkong', dateElement: 'date-hongkong' },
            'india': { name: 'Asia/Kolkata', element: 'clock-india', dateElement: 'date-india' }
        };

        // Format time with leading zero
        function formatTime(num) {
            return num < 10 ? '0' + num : num;
        }

        // Update clock display
        function updateClock(timezone, tzConfig) {
            try {
                // Get current time in the specified timezone
                const formatter = new Intl.DateTimeFormat('en-US', {
                    timeZone: timezone,
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit',
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit',
                    hour12: false
                });

                const parts = formatter.formatToParts(new Date());
                const timeObj = {};
                
                parts.forEach(part => {
                    timeObj[part.type] = part.value;
                });

                const time = `${timeObj.hour}:${timeObj.minute}:${timeObj.second}`;
                const date = `${timeObj.month}/${timeObj.day}/${timeObj.year}`;

                // Update DOM
                const clockElement = document.getElementById(tzConfig.element);
                const dateElement = document.getElementById(tzConfig.dateElement);
                
                if (clockElement) {
                    clockElement.textContent = time;
                    // Add tick animation
                    clockElement.style.animation = 'none';
                    setTimeout(() => {
                        clockElement.style.animation = 'pulse 1s ease-in-out infinite';
                    }, 10);
                }
                
                if (dateElement) {
                    dateElement.textContent = date;
                }

            } catch (error) {
                console.error(`Error updating clock for ${timezone}:`, error);
            }
        }

        // Update all clocks
        function updateAllClocks() {
            Object.values(timeZones).forEach(tzConfig => {
                updateClock(tzConfig.name, tzConfig);
            });
        }

        // Initialize clocks
        function initClocks() {
            updateAllClocks();
            // Update every second
            setInterval(updateAllClocks, 1000);
        }

        // Start the clocks when DOM is loaded
        document.addEventListener('DOMContentLoaded', initClocks);

        // Also update immediately on page visibility change
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) {
                updateAllClocks();
            }
        });
    </script>
</body>
</html>
